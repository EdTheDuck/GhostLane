[package]
name = "ghostlane"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
egui-phosphor = { version = "0.13", features = ["fill"] }
egui_commonmark = "0.24"
egui_dnd = "0.16"
egui_extras = { version = "0.35", features = ["svg"] }
egui_term = { git = "https://github.com/Harzu/egui_term", rev = "31bbc7ab8503c9518fcee5717cfa29011e59f451", version = "0.1.0" }
notify-debouncer-full = "0.7.0"
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
trash = "5.2.9"
which = "8.0.6"

[dev-dependencies]
egui_kittest = "0.35"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.31"

# Used by `cargo bundle` (https://github.com/burtonageo/cargo-bundle) for the macOS .app and Linux .deb.
[package.metadata.bundle]
name = "GhostLane"
identifier = "com.edtheduck.ghostlane"
icon = ["assets/icons/32x32.png", "assets/icons/128x128.png", "assets/icons/256x256.png", "assets/icons/512x512.png", "assets/icons/ghostlane.icns"]
category = "public.app-category.developer-tools"
short_description = "Project board that lives in your folders"
