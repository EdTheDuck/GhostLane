[package]
name = "ghostlane"
version = "0.3.0"
edition = "2024"
license = "MIT"

[dependencies]
directories = "6.0.0"
eframe = { version = "0.35", features = ["persistence"] }
egui = "0.35"
egui-phosphor = { version = "0.13", features = ["fill"] }
egui_commonmark = "0.24"
egui_dnd = "0.16"
egui_extras = { version = "0.35", features = ["svg"] }
egui_term = { git = "https://github.com/Harzu/egui_term", rev = "31bbc7ab8503c9518fcee5717cfa29011e59f451", version = "0.1.0" }
notify-debouncer-full = "0.7.0"
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
trash = "5.2.9"
which = "8.0.6"

[dev-dependencies]
egui_kittest = "0.35"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.31"

# Installers for GitHub releases, built by `cargo packager` (see .github/workflows/release.yml and
# packaging/release-windows.ps1).
[package.metadata.packager]
product-name = "GhostLane"
identifier = "com.edtheduck.ghostlane"
description = "Project board that lives in your folders"
category = "DeveloperTool"
icons = ["assets/icons/*.png", "assets/icons/ghostlane.icns", "assets/icons/ghostlane.ico"]
before-packaging-command = "cargo build --release"
binaries-dir = "target/release"
out-dir = "dist"

# Double-clicking a .ghost file opens it in GhostLane.
[[package.metadata.packager.file-associations]]
extensions = ["ghost"]
name = "GhostLane Project"
description = "GhostLane Project"
mime-type = "application/x-ghostlane"

# Teaches Linux desktops that *.ghost files are GhostLane projects, shown with the greyscale ghost.
[package.metadata.packager.deb.files]
"packaging/ghostlane-mime.xml" = "usr/share/mime/packages/ghostlane.xml"
"assets/icons/file/32x32.png" = "usr/share/icons/hicolor/32x32/mimetypes/application-x-ghostlane.png"
"assets/icons/file/64x64.png" = "usr/share/icons/hicolor/64x64/mimetypes/application-x-ghostlane.png"
"assets/icons/file/128x128.png" = "usr/share/icons/hicolor/128x128/mimetypes/application-x-ghostlane.png"
"assets/icons/file/256x256.png" = "usr/share/icons/hicolor/256x256/mimetypes/application-x-ghostlane.png"
"assets/icons/file/512x512.png" = "usr/share/icons/hicolor/512x512/mimetypes/application-x-ghostlane.png"

[package.metadata.packager.nsis]
installer-icon = "assets/icons/ghostlane.ico"
# The packager associates files with the exe's first icon, the app's own. This replaces its macro (it is inserted
# before the install section that uses it) so .ghost files get the greyscale ghost, icon index 1 (see build.rs).
preinstall-section = '''
!macroundef APP_ASSOCIATE
!macro APP_ASSOCIATE EXT FILECLASS DESCRIPTION ICON COMMANDTEXT COMMAND
  ReadRegStr $R0 SHELL_CONTEXT "Software\Classes\.${EXT}" ""
  WriteRegStr SHELL_CONTEXT "Software\Classes\.${EXT}" "${FILECLASS}_backup" "$R0"
  WriteRegStr SHELL_CONTEXT "Software\Classes\.${EXT}" "" "${FILECLASS}"
  WriteRegStr SHELL_CONTEXT "Software\Classes\${FILECLASS}" "" `${DESCRIPTION}`
  WriteRegStr SHELL_CONTEXT "Software\Classes\${FILECLASS}\DefaultIcon" "" "$INSTDIR\${MAINBINARYNAME}.exe,1"
  WriteRegStr SHELL_CONTEXT "Software\Classes\${FILECLASS}\shell" "" "open"
  WriteRegStr SHELL_CONTEXT "Software\Classes\${FILECLASS}\shell\open" "" `${COMMANDTEXT}`
  WriteRegStr SHELL_CONTEXT "Software\Classes\${FILECLASS}\shell\open\command" "" `${COMMAND}`
  ; Explorer only redraws file icons when told associations changed.
  System::Call "shell32::SHChangeNotify(i 0x08000000, i 0, p 0, p 0)"
!macroend
'''
