[package]
name = "ghostlane"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = "0.35"
egui-phosphor = "0.13"
egui_commonmark = "0.24"
egui_dnd = "0.16"
egui_extras = { version = "0.35", features = ["svg"] }
egui_term = { git = "https://github.com/Harzu/egui_term", rev = "31bbc7ab8503c9518fcee5717cfa29011e59f451", version = "0.1.0" }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
trash = "5.2.9"
which = "8.0.6"

[dev-dependencies]
tempfile = "3.27.0"
